<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smooth Transitions & Storage</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding: 2rem;
    }

    .animated-btn {
      padding: 1rem 2rem;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.4s ease, transform 0.3s ease;
    }

    .animated-btn:hover {
      background-color: #2980b9;
      transform: scale(1.05);
    }

    .box {
      width: 100px;
      height: 100px;
      margin: 2rem auto;
      background-color: #e74c3c;
      border-radius: 10px;
      transition: transform 0.5s ease;
    }

    .box.animate {
      transform: rotate(360deg) scale(1.2);
    }

    .theme-dark {
      background-color: #2c3e50;
      color: #ecf0f1;
    }

    .theme-dark .animated-btn {
      background-color: #8e44ad;
    }

    .theme-dark .animated-btn:hover {
      background-color: #6c3483;
    }

    .toggle-btn {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>Smooth Transitions & Local Storage</h1>
  <button class="animated-btn" onclick="triggerBoxAnimation()">Trigger Animation</button>

  <div class="box" id="box"></div>

  <button class="animated-btn toggle-btn" onclick="toggleTheme()">Toggle Theme</button>

  <script>
    // Load saved theme preference
    window.onload = function () {
      const savedTheme = localStorage.getItem('preferredTheme');
      if (savedTheme === 'dark') {
        document.body.classList.add('theme-dark');
      }
    };

    // Toggle between light and dark themes
    function toggleTheme() {
      document.body.classList.toggle('theme-dark');
      const isDark = document.body.classList.contains('theme-dark');
      localStorage.setItem('preferredTheme', isDark ? 'dark' : 'light');
    }

    // Trigger animation on the red box
    function triggerBoxAnimation() {
      const box = document.getElementById('box');
      box.classList.add('animate');
      setTimeout(() => box.classList.remove('animate'), 1000);
    }
  </script>

</body>
</html>
